app:
  name: SpacemiT AI Gateway
  version: 0.1.8
  host: 0.0.0.0
  port: 18790
  debug: false
auth:
  enabled: false
  api_keys: []
  ip_whitelist: []
  ip_whitelist_file: null
limits:
  max_upload_bytes: 52428800
asr:
  backend: sensevoice
  model_dir: null
  models:
  - id: sensevoice
    url: https://archive.spacemit.com/spacemit-ai/model_zoo/asr/sensevoice.tar.gz
    archive_name: sensevoice.tar.gz
    archive_subdir: sensevoice
  language: auto
  punctuation: true
  provider: spacemit
  warmup_audio_ms: 1000
  qwen3:
    endpoint: http://127.0.0.1:8063/v1/chat/completions
    model: qwen3-asr
    timeout: 60
  stream:
    session_ttl_s: 300
    event_queue_size: 64
    partial_results: true
tts:
  backend: matcha_zh_en
  backends:
  - matcha_zh
  - matcha_en
  - matcha_zh_en
  - kokoro
  model_dir: null
  models:
  - id: matcha_zh_en
    url: https://archive.spacemit.com/spacemit-ai/model_zoo/tts/matcha-tts/matcha-icefall-zh-en.tar.gz
    archive_name: matcha-icefall-zh-en.tar.gz
    vocoder_name: vocos-16khz-univ.q.onnx
    vocoder_url: https://archive.spacemit.com/spacemit-ai/model_zoo/tts/vocoder/vocos-16khz-univ.q.onnx
  speed: 1.0
  volume: 50.0
  pitch: 1.0
  default_format: wav
  stream:
    session_ttl_s: 300
    event_queue_size: 64
vad:
  backend: silero
  model_dir: null
  trigger_threshold: 0.5
  stop_threshold: 0.35
  min_speech_ms: 250
  max_silence_ms: 500
  sample_rate: 16000
  stream:
    event_queue_size: 64
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
llm:
  backend: qwen3-0.6b-q4_0
  default_args:
  - --ctx-size
  - '4096'
  - --threads
  - '8'
  - --metrics
  - --reasoning
  - 'off'
  port_pool:
    start: 18800
    end: 18900
  storage:
    base_dir: ~/.cache/spacemit-ai-gateway/llm
    models_dir: ~/.cache/models/llm
    db_path: ~/.cache/spacemit-ai-gateway/llm/db.sqlite
